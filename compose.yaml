
services:
  backend:
    build:
      context: ./bookverse-backend
    container_name: bookverse-backend
    ports:
      - "8081:8080"
    env_file:
      - .env
    volumes:
      - ./bookverse-backend/certs/aiven-truststore.p12:/app/certs/aiven-truststore.p12:ro
    environment:
      DB_URL: "jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?sslMode=VERIFY_CA&trustCertificateKeyStoreUrl=file:/app/certs/aiven-truststore.p12&trustCertificateKeyStoreType=PKCS12&trustCertificateKeyStorePassword=${DB_SSL_TRUSTSTORE_PASSWORD}"
      DB_USERNAME: avnadmin
      DB_PASSWORD: ${DB_PASSWORD}
      APP_FRONTEND_URL: http://localhost:3000
      SERVER_FORWARD_HEADERS_STRATEGY: framework
    restart: unless-stopped
  frontend:
    build:
      context: ./bookverse-frontend
    container_name: bookverse-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped